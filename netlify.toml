[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[functions]
  node_bundler = "esbuild"

# File uploads can be large (up to 5MB base64-encoded ≈ 7MB raw payload)
# Increase function timeout for image/PDF processing
[functions."chat"]
  timeout = 30

[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200
